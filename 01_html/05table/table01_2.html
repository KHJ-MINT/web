<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>테이블(표) 만들기</title>
  <style>
    table,
    th,
    td {
      border: 1px solid #ccc;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 20px;
    }
  </style>
</head>

<body>
  <table>
    <!-- caption은 표의 내용이 없으면 세로로 글자가 표시됨.. -->
    <caption>표의 구성 요소</caption>
    <tr>
      <th>주제</th>
      <th>태그</th>
      <!-- colspan : 표의 가로줄을 합치는 속성 -->
      <th colspan="2">비교</th>
    </tr>
    <tr>
      <!-- rowspan : 표의 세로줄을 합치는 속성 -->
      <th rowspan="4">테이블 구성 요소</th>
      <td>table</td>
      <td>테이블을 만드는 태그</td>
      <td>1</td>
    </tr>
    <tr>
      <td>tr</td>
      <td>테이블의 행(줄)을 만드는 태그</td>
    </tr>
    <tr>
      <td>th</td>
      <td>테이블의 제목열을 만드는 태그</td>
    </tr>
    <tr>
      <td>td</td>
      <td>테이블의 열을 만드는 태그</td>
    </tr>
  </table>
</body>

</html>
