<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서가 없는 목록</title>
  <style>
    ul {
      /* 목록에 순서가 생기는 속성 */
      list-style: decimal;
    }
    ol {
      /* 목록에 ul과 같은 점이 생기는 속성 */
      list-style: disc;
    }
  </style>
</head>
<body>
  <ul>
    <li>멜론</li>
    <li>딸기</li>
    <li>배</li>
    <li>포도</li>
  </ul>
  <ol>
    <li>멜론</li>
    <li>딸기</li>
    <li>배</li>
    <li>포도</li>
  </ol>
</body>
</html>
