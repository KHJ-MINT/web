<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서가 있는 목록</title>
</head>

<body>
  <ol>
    <li>첫번째</li>
    <li>두번째</li>
    <li>세번째</li>
  </ol>
  <section>
    <h2>커피 드립 순서 - 알파벳 대문자 역순</h2>
    <ol type="A" reversed>
      <!-- reversed 속성은 li 태그의 '순번을 역순으로' 바꾸는 거지, '내용을 역순으로' 바꾸는게 아님! -->
      <li>필터 접기</li>
      <li>분쇄</li>
      <li>불림</li>
      <li>추출</li>
    </ol>
  </section>

  <section>
    <h2>커피 드립 순서 - 아라비아 숫자 3부터</h2>
    <!-- start 속성의 숫자에 따라 type의 시작값이 달라진다. -->
    <!-- reversed 속성을 사용한 경우, start 속성의 숫자에서부터 숫자가 줄어든다. -->
    <ol start="3">
      <li>필터 접기</li>
      <li>분쇄</li>
      <li>불림</li>
      <li>추출</li>
    </ol>
  </section>
</body>

</html>
