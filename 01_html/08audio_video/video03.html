<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배경 비디오</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    figure {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    #bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #container {
      position: absolute;
      left: 100px;
      top: 100px;
      color: #fff;
    }
  </style>
</head>
<body>
  <figure>
    <video autoplay muted loop playsinline src="media/flower.mp4" id="bg" poster="images/flame.jpg"></video>
    <!-- playsinline 속성 : 아이폰 등 일부 기기에서 비디오가 팝업으로 나타나는 현상을 방지해 줌. -->
  </figure>
  <div id="container">
    <h2>FLOWER VIDEO</h2>
  </div>
</body>
</html>
