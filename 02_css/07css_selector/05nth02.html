<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nth-child 선택자 2</title>
  <style>
    :root {
      font-size: 20px;
      --font-color: #333;
      --point-color1: tomato;
      --point-color2: blueviolet;
      --point-color3: teal;
    }

    ul {
      list-style: none;
    }

    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#">메뉴1</a></li>
      <li><a href="#">메뉴2</a></li>
      <li><a href="#">메뉴3</a></li>
      <li><a href="#">메뉴4</a></li>
      <li><a href="#">메뉴5</a></li>
      <li><a href="#">메뉴6</a></li>
      <li><a href="#">메뉴7</a></li>
      <li><a href="#">메뉴8</a></li>
    </ul>
  </nav>
</body>
</html>
