<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation 1</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background: blue;
      /* animation-name, animation-duration 두 값은 필수값임! */
      animation-name: changeBg; /* 애니메이션 이름 */
      animation-duration: 3s; /* 애니메이션 실행 시간 */
      animation-iteration-count: 3; /* 애니메이션 실행 횟수 */
      animation-direction: alternate; /* 애니메이션 실행 방향. 첫 실행 후 다시 실행될 때 되돌아가는 과정이 보임 */
    }

    @keyframes changeBg {
      from { /* 0%. 시작 */
        background: blue;
      }

      to { /* 100%. 종료 */
        background: tomato;
        border: 1px solid yellowgreen;
        border-radius: 50%;
      }
    }
  </style>
</head>

<body>
  <div class="box"></div>
</body>

</html>
