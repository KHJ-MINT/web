<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation 연습</title>
  <link rel="stylesheet" href="css/ani.css">
</head>
<body>
  <div class="wrap">
    <div class="viking">
      <img src="../images/biking_1.png" alt="바이킹 뒤">
      <img src="../images/biking_2.png" alt="바이킹 무빙">
      <img src="../images/biking_3.png" alt="바이킹 앞">
    </div> <!-- //.viking -->
    <div class="swing">
      <img src="../images/swing_1.png" alt="스윙 뒤">
      <img src="../images/swing_2.png" alt="스윙 무빙">
      <img src="../images/swing_3.png" alt="스윙 앞">
    </div> <!-- //.swing -->
    <div class="train"></div>
    <div class="seat2"></div>
    <div class="machine">
      <img src="../images/leg.png" alt="관람차 다리">
      <div class="rotate">
        <img class="s1" src="../images/seat.png" alt="관람차 좌석">
        <img class="s2" src="../images/seat.png" alt="관람차 좌석">
        <img class="s3" src="../images/seat.png" alt="관람차 좌석">
        <img class="s4" src="../images/seat.png" alt="관람차 좌석">
        <img class="s5" src="../images/seat.png" alt="관람차 좌석">
        <img class="s6" src="../images/seat.png" alt="관람차 좌석">
        <img class="s7" src="../images/seat.png" alt="관람차 좌석">
        <img class="s8" src="../images/seat.png" alt="관람차 좌석">
        <img class="s9" src="../images/seat.png" alt="관람차 좌석">
        <img class="s10" src="../images/seat.png" alt="관람차 좌석">
        <img class="s11" src="../images/seat.png" alt="관람차 좌석">
        <img class="s12" src="../images/seat.png" alt="관람차 좌석">
      </div> <!-- //.rotate -->
    </div> <!-- //.machine -->
  </div> <!-- //.wrap -->
</body>
</html>
