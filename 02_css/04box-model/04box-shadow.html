<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>box shadow</title>
  <style>
    div {
      width: 100px;
      height: 100px;
      margin: 15px;
      border: 2px solid;
      text-align: center;
      display: inline-block;
      line-height: 100px;
    }

    /* box-shadow : 수평거리(x축) 수직거리(y축) 흐림정도 번짐정도 색상 (inset) */
    .box1 {
      /* border에 color를 지정하지 않았다면 글자색과 동일하게 적용됨 */
      color: red;
      box-shadow: 2px -2px 5px 0 violet;
    }

    .box2 {
      box-shadow: 5px 5px 15px 5px gray;
    }

    .box3 {
      /* inset 값 : 안쪽 그림자로 설정 */
      box-shadow: 3px 3px 3px 3px #ff0 inset;
    }

    .box4 {
      box-shadow: 5px -3px 10px 10px #999;
    }

    .box5 {
      box-shadow: 10px -10px 20px 5px cyan inset;
    }

    .box6 {
      box-shadow: 0px 0px 10px 10px tomato;
    }
  </style>
</head>

<body>
  <div class="box1">박스1</div>
  <div class="box2">박스2</div>
  <div class="box3">박스3</div>
  <div class="box4">박스4</div>
  <div class="box5">박스5</div>
  <div class="box6">박스6</div>
</body>

</html>
