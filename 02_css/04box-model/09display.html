<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>display 속성</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      margin: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    img {
      width: 300px;
    }

    #inline img:nth-child(2) {
      /* 요소가 보이지 않게 하는 속성. 그러나 영역은 그대로 차지함. */
      visibility: hidden;
    }

    #block img {
      display: block;
    }

    #block img:nth-child(2) {
      /* 요소가 보이지 않게 하는 속성. 영역도 함께 사라짐. 음성 인식기로도 읽지 못함. */
      display: none;
    }

    ul {
      width: 500px;
      margin: 0 auto;
      background-color: #ccc;
    }

    li {
      display: inline-block;
      width: 100px;
      background-color: khaki;
    }

    a {
      color: inherit;
      text-decoration: none;
      background-color: lightcoral;
    }

  </style>
</head>

<body>
  <div id="inline">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn-nCf5wDrojJ5WlFh6CwnS-2FG0ot_gXakY4p2SteRg&s=10"
      alt="연예인 이미지">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn-nCf5wDrojJ5WlFh6CwnS-2FG0ot_gXakY4p2SteRg&s=10"
      alt="연예인 이미지">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn-nCf5wDrojJ5WlFh6CwnS-2FG0ot_gXakY4p2SteRg&s=10"
      alt="연예인 이미지">
  </div>
  <div id="block">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn-nCf5wDrojJ5WlFh6CwnS-2FG0ot_gXakY4p2SteRg&s=10"
      alt="연예인 이미지">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn-nCf5wDrojJ5WlFh6CwnS-2FG0ot_gXakY4p2SteRg&s=10"
      alt="연예인 이미지">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQn-nCf5wDrojJ5WlFh6CwnS-2FG0ot_gXakY4p2SteRg&s=10"
      alt="연예인 이미지">
  </div>
  <nav>
    <ul>
      <li><a href="#">메뉴1</a></li>
      <li><a href="#">메뉴2</a></li>
      <li><a href="#">메뉴3</a></li>
      <li><a href="#">메뉴4</a></li>
    </ul>
  </nav>
</body>

</html>
