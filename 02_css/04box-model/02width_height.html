<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>width, height 속성</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      padding: 30px;
    }

    h2 {
      margin-bottom: 10px;
    }

    p {
      margin-bottom: 20px;
    }

    div {
      margin-bottom: 20px;
      padding: 16px;
      border: 1px solid #333;
    }

    .box1 {
      background: orange;
      width: 400px;
      height: 100px;
      text-align: center;
      line-height: 66px;
    }

    .box2 {
      background: green;
      /* 가변 너비 : 브라우저 창 너비의 50% */
      width: 50%;
      /* 가변 높이는 부모 요소가 가진 고정된 높이가 있어야 적용된다. */
      height: 50%;
    }

    .box3 {
      background: rgb(0, 0, 225);
      height: 80px;
    }

    .box4 {
      background: pink;
      width: 80%;
      height: 1000px;
    }

    .box4_1 {
      background: gold;
      /* 가변 너비 : 부모 요소에 지정된 값이 있을 경우 부모 요소를 기준으로 적용 */
      width: 50%;
      height: 50%;
    }

    .vwvh {
      background: #d9f0ff;
      /* vw 단위는 브라우저의 스크롤 사이즈를 포함한다. */
      width: 50vw;
      height: 20vh;
    }

    .parent {
      width: 250px;
      border: 1px solid #333;
    }

    .min_content {
      /* 콘텐츠가 줄어들 수 있는 최소 너비 */
      width: min-content;
      background: red;
    }

    .max_content {
      /* 콘텐츠가 줄바꿈 없이 표시될 수 있는 최대 너비 */
      width: max-content;
      background: blue;
    }

    .fit_content {
      /* 콘텐츠 크기만큼 너비를 가지되, 부모 영역을 넘지 않도록 조절 */
      width: fit-content;
      background: green;
    }

    .calc {
      background: yellowgreen;
      width: calc(100% - 100px);
    }

    .clamp {
      /* clamp() : 반응형 사이트 제작시 자주 사용하며, 최소값, 선호값, 최대값을 함께 지정함 */
      background: coral;
      width: clamp(300px, 50vw, 800px);
    }
  </style>
</head>

<body>
  <h2>width height 속성</h2>
  <p>실제 콘텐츠 영역의 크기 지정</p>
  <div class="box1">박스1</div>
  <div class="box2">박스2</div>
  <div class="box3"></div>
  <div class="box4">
    <div class="box4_1"></div>
  </div>
  <div class="vwvh">뷰포트 너비/높이를 기준으로 크기를 지정합니다.</div>
  <div class="parent">
    <div class="min_content">Frontend Development Class</div>
    <div class="max_content">Frontend Development Class</div>
    <div class="fit_content">Frontend Development Class</div>
  </div>
  <div class="calc">calc():계산식을 사용해 크기를 지정합니다.</div>
  <div class="clamp">clamp():최소값, 선호값, 최대값을 함께 지정합니다.</div>
</body>

</html>
