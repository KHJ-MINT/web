<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition 03</title>
  <style>
    #btn {
      width: 100px;
      height: 50px;
    }

    .tr1 {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 1px solid #333;
      background: tomato;
      position: absolute;
      left: 50%;
      top: 50%;
      margin-left: -50px;
      margin-top: -50px;
      /* transition에 프로퍼티를 넣지 않으면 all로 적용됨.
      시간은 여러 개를 입력할 경우 지속시간->딜레이 순임!
       */
      transition: 2s 3s linear;
    }

    .tr1.on {
      width: 200px;
      height: 200px;
      background: aqua;
      border: 3px dotted green;
      border-radius: 0;
      transform: rotate(270deg);
    }
  </style>
</head>

<body>
  <button type="button" id="btn">타이틀을 바꾸자</button>
  <div class="tr1"></div>
  <script>
    document.getElementById('btn').addEventListener('click', ()=> {
      document.querySelector('.tr1').classList.toggle('on');
    });
  </script>
</body>

</html>
