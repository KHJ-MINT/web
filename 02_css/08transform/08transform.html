<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>card 뒤집기(transform 활용)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }

    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: 0.6s;
      transform-style: preserve-3d;
      transform-origin: top center;
    }

    .con:hover .card {
      transform: rotateX(180deg);
    }

    .face {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
    }

    .face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back {
      transform: rotateY(180deg);
      backface-visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ4IL9tq9Sr69xkoshAJUqlKB2tsmSR5UMNVVS53VJAWA&s=10"
          alt="화보 앞면"></div>
      <div class="face back"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTCMFkmuXeZS3Jwjs00eq-01eni0n6xcD7n23gkW3scTw&s=10"
          alt="화보 뒷면"></div>
    </div> <!-- //.card -->
  </div> <!-- //.con -->
</body>

</html>
