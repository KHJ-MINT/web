<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>backface-visiblity</title>
  <style>
    .container {
      width: 200px;
      height: 200px;
      border: 1px solid #000;
      margin-left: 300px;
      position: relative;
    }

    .container .card {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      transition: 0.6s;
      /* background: #ccc; */
      /* transform 될 때의 기준점 재설정 */
      transform-origin: left center;
      /* 2d가 아닌 3d로 바꿈. */
      transform-style: preserve-3d;
    }

    .container:hover .card {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      font-size: 30px;
    }

    .front {
      background: tomato;
    }

    .back {
      background: cornflowerblue;
      /* transform: rotateY(180deg); */
    }

    .hidden {
      /* backface-visibility : 요소의 뒷면을 보이게 할 것인지 정하는 속성. 3d일 때만 사용 가능! */
      backface-visibility: hidden;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="face front">
        front
      </div> <!-- //.front -->
    </div> <!-- //.card -->
  </div> <!-- //.container -->

  <div class="container">
    <div class="card">
      <div class="face front hidden">
        front
      </div> <!-- //.front -->
    </div> <!-- //.card -->
  </div> <!-- //.container -->

  <div class="container">
    <div class="card">
      <div class="face front hidden">
        front
      </div> <!-- //.front -->
      <div class="face back hidden">
        back
      </div> <!-- //.back -->
    </div> <!-- //.card -->
  </div> <!-- //.container -->
</body>

</html>
