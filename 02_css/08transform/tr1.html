<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition 01</title>
  <style>
    .tr1 {
      width: 100px;
      height: 100px;
      background: skyblue;
      border: 1px solid #000;
      /* transition-property : 트랜지션을 적용할 요소 선택. 기본은 all(전체) */
      transition-property: width, height;
      /* transition-duration : 트랜지션을 적용할 시간 */
      transition-duration: 2s, 1s;
    }

    .tr1:hover {
      width: 200px;
      height: 150px;
      background: tomato;
    }
  </style>
</head>

<body>
  <div class="tr1"></div>
</body>

</html>
