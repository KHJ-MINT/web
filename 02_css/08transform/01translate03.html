<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>translate 03</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      width: 600px;
      height: 400px;
      margin: 100px auto;
      border: 1px solid #000;
      position: relative;
      /* 원근감(깊이) 
        원근감을 주고자 하는 부모 요소에 추가해야 함!
      */
      perspective: 1600px;
    }

    div p {
      width: 100%;
      height: 100%;
      background: blue;
      opacity: 0.3;
      color: #fff;
      font-size: 60px;
      position: absolute;
      left: 0;
      top: 0;
      transition: 0.6s;
    }

    div:hover p:nth-child(1) {
      transform: translateZ(-500px);
    }

    div:hover p:nth-child(2) {
      transform: translateZ(0);
    }

    div:hover p:nth-child(3) {
      transform: translateZ(500px);
    }
  </style>
</head>

<body>
  <div class="box">
    <p>box1</p>
    <p>box2</p>
    <p>box3</p>
  </div>
</body>

</html>
