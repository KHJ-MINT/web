<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-box - z-index</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      height: 100px;
    }

    .flex_item {
      opacity: 0.8;
    }

    .flex_item:nth-child(2) {
      transform: scale(1.5);
      z-index: 10; /* position에서처럼 우선 순위를 바꾸는 속성. */
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">dddddddddddddd</div>
    <div class="flex_item">sssssssssssssss</div>
    <div class="flex_item">33333333333333</div>
  </div>
</body>

</html>
