<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-box - columns</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .flex_item {
      flex: 1 auto;
    }

    @media screen and (min-width: 600px) { /* 600px보다 큰 화면에서 적용됨! */
      .flex_container {
        flex-flow: row wrap;
      }

      .flex_item {
        width: 50%;
      }
    }

    @media screen and (min-width: 900px) { /* 900px보다 큰 화면에서 적용됨! */
      .flex_item {
        width: 30%;
      }
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">AAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCC</div>
    <div class="flex_item">AAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCC</div>
    <div class="flex_item">AAAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCC</div>
  </div>
</body>

</html>
