<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-box - flex</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .parent {
      margin-top: 100px;
    }

    .flex_container {
      display: flex;
    }

    /* flex : flex-grow flex-shrink flex-basis */
    /* 
    flex-grow : 아이템을 배치하고 남은 공간을 채우기 위해 아이템의 너비 또는 높이를 늘림
    flex-shrink : 아이템을 배치하고 공간이 부족할 때 아이템의 너비 또는 높이를 줄임. 기본적으로 줄어들도록 되어 있음.(기본 값 : 1)
    flex-basis : 아이템의 "기본" 크기. width 값이 정해져 있다면 해당 값만큼 사용.
    */
    .flex_item {
      flex: 1 1 0;
      /* flex-basis를 0으로 하려 할 때 */
      flex: 1;
    }

    .con {
      width: 800px;
      margin: 0 auto;
    }

    .con .flex_item:nth-child(1) {
      flex: 1;
    }

    .con .flex_item:nth-child(2) {
      flex: 3;
    }

    .con .flex_item:nth-child(3) {
      flex: 2;
    }

    .parent .flex_item {
      flex: 1 1 auto;
      flex: 1 auto; /* flex-basis를 유지하고 싶을 경우 */
    }
  </style>
</head>

<body>
  <div class="flex_container con">
    <div class="flex_item">
      <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Molestiae inventore deleniti dolor consectetur amet
        aperiam enim deserunt ipsam harum, veritatis error. Vel odio repudiandae ab doloremque provident reiciendis
        inventore facilis.</p>
    </div>
    <div class="flex_item">BB</div>
    <div class="flex_item">CCCCCCC</div>
  </div>
  <div class="flex_container parent">
    <div class="flex_item">1111111111111</div>
    <div class="flex_item">22222222</div>
    <div class="flex_item">333</div>
  </div>
</body>

</html>
