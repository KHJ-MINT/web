<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-box - align-self</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      height: 100vh;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .flex_item:nth-child(2) {
      align-self: auto; /* 기본값. 부모의 align-items를 따름 */
      align-self: stretch;
      align-self: flex-start;
      align-self: flex-end;
      align-self: baseline;
      align-self: center;
      align-self: normal; /* 레이아웃 형태나 브라우저에 따라 다르게 정렬함. */
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">dddddddddddddd</div>
    <div class="flex_item">sssssssssssssss</div>
    <div class="flex_item">33333333333333</div>
  </div>
</body>

</html>
