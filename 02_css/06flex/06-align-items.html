<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-box - align-items</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      width: 800px;
      height: 300px;
      align-items: stretch;
      /* 기본값. item들이 교차축 방향으로 늘어남. */
      align-items: flex-end;
      /* item들이 교차축 끝점으로 정렬됨. */
      align-items: center;
      /* item들이 교차축 중앙으로 정렬됨. */
      align-items: flex-start;
      /* item들이 교차축 시작점으로 정렬됨. */
      align-items: baseline;
      /* item들이 교차축의 '문자 기준선'에 맞춰서 정렬됨. */
    }

    .flex_item:nth-child(1) {
      font-size: 30px;
    }

    .flex_item:nth-child(2) {
      font-size: 12px;
    }

    .flex_item:nth-child(3) {
      font-size: 50px;
      align-self: center;
    }

    .parent {
      margin-top: 50px;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">dddddddddddddd</div>
    <div class="flex_item">sssssssssssssss</div>
    <div class="flex_item">33333333333333</div>
  </div>
  <div class="flex_container parent">
    <div class="flex_item">33333333333333</div>
  </div>
</body>

</html>
