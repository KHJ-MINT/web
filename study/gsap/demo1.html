<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP DEMO 1 - 간단한 트윈 애니메이션</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="./js/demo1.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 40px;
    }

    .box {
      width: 100px;
      height: 100px;
      background-color: tomato;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="box box_to green"></div>
  <div class="box box_from green"></div>
  <div class="box box_fromto green"></div>
</body>

</html>
