<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디지털 시계 만들기</title>
  <style>
    #divClock {
      text-align: center;
      margin-top: 100px;
      font-size: 2rem;
      columns: #333;
    }
  </style>
</head>

<body>
  <div id="divClock"></div>

  <script>
    //디지털 시계 함수
    function divClock() {
      //현재 시간 정보를 가져옴
      let today = new Date();

      //날짜 부분(월/일)
      let day = (today.getMonth() + 1) + '월 ' + today.getDate() + '일 ';

      //시, 분, 초
      let time = today.getHours() + '시 ' + today.getMinutes() + '분 ' + today.getSeconds() + '초';

      //화면에 출력
      document.getElementById('divClock').innerHTML = `<h1>${day + time}</h1>`;

      //setTimeout(function, ms) : ms 후에 딱 한 번 함수를 실행함.
      setTimeout(divClock, 1000);
    }

    //페이지 로딩 시 바로 시작.
    divClock();
  </script>
</body>

</html>
