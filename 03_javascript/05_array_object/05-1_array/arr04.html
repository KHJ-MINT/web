<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>array 04 - 배열</title>
</head>

<body>
  <script>
    /*
      배열을 객체로 생성- 좋아하는 연예인 5명
      함수선언 =  for in문 으로 출력  alert
      배열데이터[0] : 송중기
    */

    let arr = new Array('신성록', '전동석', '홍광호', '이창섭', '카이');

    function insertArr() {
      for (let i in arr) {
        //for in 문에서 변수 i는 string 타입임.
        arr[i] = prompt(`좋아하는 연예인을 입력하세요. ${Number(i)+1}`);
      }
    }

    function printArr() {
      insertArr();
      for (let i in arr) {
        alert(`배열 데이터[${i}] : ${arr[i]}`);
      }
    }

    // printArr();
  </script>

  <button type="button" onclick="printArr()">연예인 호출</button>
</body>

</html>
