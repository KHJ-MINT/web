<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reverse() 메서드</title>
</head>
<body>
  <script>
    let data = ['9','8','7','6','5','4'];
    let rData = data.reverse();
    console.log(data.join('-')); // reverse() 메서드는 원본 배열을 변경하는 메서드임!
    console.log(rData.join('-'));
  </script>
</body>
</html>
