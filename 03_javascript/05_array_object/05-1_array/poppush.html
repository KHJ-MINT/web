<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pop() &amp; push() 메서드</title>
</head>

<body>
  <script>
    let kdata = ['신성록', '전동석', '홍광호', '이창섭', '카이'];
    //push 메소드 : 배열의 마지막 위치에 데이터를 추가하고 배열의 길이를 반환
    let p1 = kdata.push('박은태', '규현');

    console.log(kdata); // 실제 배열이 변경됨.
    console.log(p1); // 배열의 길이 반환

    //pop 메소드 : 배열의 마지막 위치에 있는 데이터를 삭제하고 삭제한 데이터를 반환
    let p2 = kdata.pop();
    console.log(p2);
    console.log(kdata);
  </script>
</body>

</html>
