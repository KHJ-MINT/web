<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>브라우저 공통 이벤트 실습</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      height: 200vh;
      /* 스크롤 확인 위해 높게 설정 */
      margin: 0;
      padding: 20px;
    }

    #log {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 300px;
      height: calc(100vh - 20px);
      padding: 10px;
      border: 1px solid #333;
      background: #f9f9f9;
      font-size: 14px;
      white-space: pre-line;
      /* 줄바꿈 표시 */
      overflow-y: auto;
    }

    img {
      width: 300px;
      margin-top: 50px;
    }
  </style>
</head>

<body>
  <h1>브라우저 공통 이벤트 실습</h1>
  <div id="log">이벤트 로그</div>

  <!-- 테스트 이미지 -->
  <img src="https://img.vogue.co.kr/vogue/2024/05/style_663b35976b820-1920x1080.jpg" alt="테스트이미지" class="testImg"
    id="testImg">

  <!-- abort 테스트 버튼 -->
  <div>
    <button id="abortBtn">이미지 로딩 중단</button>
    <button id="reBtn">이미지 로딩 다시시작</button>
    <a href="http://naver.com">네이버</a>
  </div>

  <script>
    let order = 1;

    document.addEventListener('DOMContentLoaded', () => {
      //'DOMContentLoaded'는 DOM 요소가 모두 로드되고 난 후 스크립트를 실행하는 이벤트임!
      const logBox = document.getElementById('log'); //이벤트 로그를 출력할 요소
      function log(msg) {
        console.log(msg);
        logBox.innerHTML += msg + '\n';
      }

      const testImg = document.getElementById('testImg');
      const abortBtn = document.getElementById('abortBtn');
      const reBtn = document.getElementById('reBtn');
      const imgSrc = testImg.src;
      log(`${order++} : DOMContentLoaded : DOM 준비 완료!`);
      log(`기본 창크기 : ${window.innerWidth} x ${window.innerHeight}`);
      log(`-> 원본 사이즈 : ${testImg.naturalWidth} x ${testImg.naturalHeight} (아직 로딩되지 않았으면 0!)`);

      window.addEventListener('load', () => {
        log(`${order++} : window.load 모든 리소스 로딩 완료!`);
        log(`-> 원본 사이즈 : ${testImg.naturalWidth} x ${testImg.naturalHeight}`);
      });

      testImg.addEventListener('load', () => { //load 이벤트를 반드시 윈도우에만 쓸 수 있는 것은 아님!
        log(`${order++} : testImg.load 이미지 로딩 완료!`);
        log(`-> 원본 사이즈 : ${testImg.naturalWidth} x ${testImg.naturalHeight}`);
      });
    }); //end
  </script>
</body>

</html>
