<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>const 상수 선언</title>
</head>

<body>
  <script>
    const cm = prompt('m로 변환할 cm를 입력하세요.');
    const dValue = 100;
    const m = cm / dValue;
    document.write(m + 'm입니다.');
  </script>
</body>

</html>
