<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>let 변수 선언 02</title>
</head>
<body>
  <script>
    let js = 'javascript';
    let funny = '재미있어요.';
    let num = 100;

    // document.write를 사용해서
    // javascript는 100배 재미있어요. 출력하기.
    document.write('1. ' + js + '는 ' + num + '배 ' + funny + '<br/>'); //변수와 + 연산자 사용.
    document.write(`2. ${js}는 ${num}배 ${funny}`); //백틱 사용.
  </script>
</body>
</html>
