<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>typeof 연산자를 사용하여 데이터 타입 확인하기</title>
</head>

<body>
  <script>
    let num; //undefind
    let obj = null;
    let arr = [1, 2, 3]; //배열(array). object 타입
    let obj2 = { name: '김희정', age: 18, gender: 'f' };
    let str = '문자';
    let num2 = 2;
    let bol = true;

    console.log(typeof num); //undefined
    console.log(typeof num2); //number
    console.log(typeof 100); //number
    console.log(typeof obj); //object -> null이지만 설계 오류로 인해 object로 나옴.
    console.log(typeof arr);
    console.log(typeof obj2);
    console.log(typeof str);
    console.log(typeof bol);
  </script>
</body>

</html>
