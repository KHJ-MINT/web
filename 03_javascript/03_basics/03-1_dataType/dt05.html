<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>undefined 데이터 타입</title>
</head>

<body>
  <script>
    // undefined 데이터는 변수를 선언하였으나, 데이터 값을 지정하지 않았을 경우.
    let temp; //변수 선언. 값을 할당하지 않음.
    console.log(temp);

    // 객체에 속성 값을 지정하지 않았을 경우 자동으로 지정되는 값.
    let obj = { name: '김희정', age: 18 }; // 객체 선언.
    obj.job = '디자이너';
    console.log(obj.name);
    console.log(obj.age);
    console.log(obj.job);
    console.log(obj.job2); // 없는 속성 값을 부름.
  </script>
</body>

</html>
