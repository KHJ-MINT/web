<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if문 test</title>
</head>

<body>
  <div id="result"></div>

  <script>
    /*
      국어, 영어, 수학 점수를 prompt로 받아와서 -> 점수 변수 3개
      토탈 -> 점수 합산 변수
      평균 -> 점수 평균 변수
      학점 -> 변수 선언만. if문에서 값 대입.

      평균이 90점 이상이면 A
      80점 이상이면 B
      70점 이상이면 C
      60점 이상이면 D
      그외는 F
      "당신의 학점은      입니다"
    */

    let kor = Number(prompt('당신의 국어 점수를 입력하세요.', 0));
    let eng = Number(prompt('당신의 영어 점수를 입력하세요.', 0));
    let math = Number(prompt('당신의 수학 점수를 입력하세요.', 0));
    let total = kor + eng + math;
    let avg = total / 3;
    let hak = '';
    let result = document.getElementById('result');

    if (avg >= 90) {
      hak = 'A';
    } else if (avg >= 80) {
      hak = 'B';
    } else if (avg >= 70) {
      hak = 'C';
    } else if (avg >= 60) {
      hak = 'D';
    } else {
      hak = 'F';
    }

    result.innerHTML = `당신의 학점은 ${hak}입니다.`;
  </script>
</body>

</html>
