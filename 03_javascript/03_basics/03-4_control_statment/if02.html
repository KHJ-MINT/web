<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if문 02</title>
</head>

<body>
  <script>
    if (1 < 0) {
      document.write('참일 때 실행');
    } else {
      document.write('거짓일 때 실행');
    }

    document.write('<br>');

    if (0) {
      document.write('1.참일 때 실행');
    } else {
      document.write('1.거짓일 때 실행');
    }
  </script>
</body>

</html>
