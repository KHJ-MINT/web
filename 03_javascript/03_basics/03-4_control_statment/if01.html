<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>if문 01</title>
</head>

<body>
  <script>
    let num = prompt('1부터 1000까지 숫자 중 마음에 드는 숫자를 입력하세요.', '1');

    if (num <= 500) document.write('hello'); // if문이 한 줄일 때 중괄호 생략 가능

    document.write('<br>the end.');

      if(조건식){

      } 
    */
  </script>
</body>

</html>
