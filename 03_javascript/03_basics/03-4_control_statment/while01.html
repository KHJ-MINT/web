<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>while문 01</title>
</head>

<body>
  <script>
    let i = 1; //초기식
    while (i <= 10) { //조건식
      document.write(i+'<br/>');
      i++; // 증감식
    }
  </script>
</body>

</html>
