<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>function 03 - 함수 선언 방식 3종(화살표 함수)</title>
</head>
<body>
  <script>
    const printMsg = (name, age) => {
      document.write(`학생 이름 : <b>${name}</b> <br/>`);
      document.write(`학생 나이 : <b>${age}</b> <br/>`);
    }
  </script>

  <button type="button" onclick="printMsg('홍길동', 18)">학생 정보</button>
</body>
</html>
