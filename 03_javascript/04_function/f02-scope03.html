<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>function 02 - 변수 스코프(let, const 예약어를 사용한 변수)</title>
</head>

<body>
  <script>
    /*
      vG : var Global
      lG : let Global
      lF : let Function (함수 지역)
      vF : var Function (함수 스코프)
      lB / cB : let Block, const Block (블록 스코프)
      autoG : 자동 전역
    */

    // 전역 스코프
    var vG = 10; // 전역 변수 var global
    let lG; // 전역 변수 let global

    function testScope() {
      //함수 스코프
      vG = 100;
      autoG = 200; // 선언 키워드 없음 -> 자동 전역 변수(암묵적 호이스팅)
      lG = 300; // 전역 변수 lG 값 변경

      let lF = 400; // 함수 지역 변수 let

      //블록 스코프
      if (true) {
        var vF = 10;
        let lB = 20;
        let lTmp = 30;
        const cB = 40;

        console.log(`lB : ${lB}`);
        console.log(`cB : ${cB}`);
      }
      //블록 밖에서 출력.
      console.log(`vG : ${vG}`); // 100 - 전역 변수.
      console.log(`autoG : ${autoG}`); // 200 - 선언 키워드 없이 선언한 전역 변수.
      console.log(`lG : ${lG}`); // 300 - 전역 변수.
      console.log(`lF : ${lF}`); // 400 - 함수 지역 변수.
      console.log(`vF : ${vF}`); // 10 - var로 선언한 변수 -> 함수 스코프(함수 전체에서 접근 가능).
      //console.log(`cB : ${cB}`); // error - const로 선언한 변수 -> 블록 스코프(변수를 선언한 블록 안에서만 가능.)
      //console.log(`lTmp : ${lTmp}`); // error - let으로 선언한 변수 -> 블록 스코프(변수를 선언한 블록 안에서만 가능.)
    }

    testScope();
  </script>
</body>

</html>
