<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP 스터디</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
  <script src="js/gsap_study.js"></script>
  <style>
    /* Global styles come from external css https://codepen.io/GreenSock/pen/xxmzBrw */

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      min-height: 100vh;
      gap: 1rem;
    }

    .box {
      display: block;
      width: 100px;
      height: 100px;
      margin: 10px;
    }

    .green {
      background-color: green;
    }

    .orange {
      background-color: orange;
    }

    .purple {
      background-color: purple;
    }
  </style>
</head>

<body>
  <div class="box box1 green"></div>
  <div class="box box2 orange"></div>
  <div class="box box3 purple"></div>
</body>

</html>
